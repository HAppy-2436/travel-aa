name: CI

# 唯一验收入口就是 `npm test`（tests/run-all.js）。
# 这里**不重复**写一串命令：本地跑什么，CI 就跑什么，避免"CI 绿了但本地红"。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: 全量验收（node ${{ matrix.node }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 是 server/deploy.sh 里强制的最低版本；22 对齐 server/Dockerfile
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          # 两个 lockfile 都要参与缓存键，否则改了 server 依赖不会刷新缓存
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: 安装依赖
        run: npm ci

      # ⚠️ 必须单独装 server 依赖：tests/server.test.js 会**真实拉起后端**，
      # 而 server/ 是独立的 package.json（express / better-sqlite3 / multer …），
      # 根目录的 npm ci 不会装它 —— 漏掉这一步 CI 会稳定红在"服务器集成测试"，
      # 且报错是"后端未能启动"，很容易被误判成代码问题。
      - name: 安装服务端依赖（server.test.js 需要真实拉起后端）
        run: npm ci --prefix server

      - name: 全量验收
        run: npm test
        env:
          # 显式声明"无 Key"：所有 AI 能力必须能走本地规则引擎跑通。
          # 有 Key 才走云端的路径由单元测试用桩覆盖，CI 不依赖任何密钥。
          TRAVELAA_OFFLINE: '1'

      - name: 上传验收日志（失败时用于定位）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-node${{ matrix.node }}
          path: tests/.output/
          if-no-files-found: ignore
