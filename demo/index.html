<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TravelAA · 多人实时联动演示</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#08080c;--white:#fff;--g100:#f7f7f8;--g200:#eeeef0;--g300:#d4d4d8;--g400:#a1a1aa;--g500:#71717a;--pri:#FF6B35;--pri-bg:#FFF0EB;--grn:#07C160;--grn-bg:#EDFAF3;--red:#FA5151;--red-bg:#FEF0F0;--amb:#FF9500;--amb-bg:#FFF8EE;--blu:#1a73e8}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:#fff;min-height:100vh;overflow-x:auto;-webkit-font-smoothing:antialiased}
.bg{position:fixed;inset:0;background:radial-gradient(ellipse 60% 40% at 20% 10%,rgba(255,107,53,0.06),transparent 60%),radial-gradient(ellipse 50% 50% at 80% 80%,rgba(100,100,255,0.04),transparent 60%);z-index:0}
.wrap{position:relative;z-index:1;max-width:1600px;margin:0 auto;padding:28px 32px}
.hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;padding-bottom:20px;border-bottom:1px solid rgba(255,255,255,0.05)}
.hdr h1{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:-0.8px;background:linear-gradient(135deg,#fff 40%,rgba(255,255,255,0.5));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hdr p{font-size:13px;color:rgba(255,255,255,0.3);margin-top:5px}
.hdr-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.cb{padding:9px 18px;border:1px solid rgba(255,255,255,0.08);border-radius:100px;background:rgba(255,255,255,0.03);color:rgba(255,255,255,0.7);font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s cubic-bezier(.4,0,.2,1);white-space:nowrap}
.cb:hover{background:rgba(255,255,255,0.08);color:#fff;transform:translateY(-1px)}
.cb.pr{background:var(--pri);border-color:var(--pri);color:#fff;box-shadow:0 4px 16px rgba(255,107,53,.25)}
.cb.act{border-color:rgba(255,107,53,.3);color:var(--pri)}
/* 「＋ 加手机」首次进入时的呼吸高亮：多人场景最容易被忽略的一步 */
@keyframes nud{0%,100%{box-shadow:0 0 0 0 rgba(255,107,53,0);border-color:rgba(255,255,255,.08)}50%{box-shadow:0 0 0 5px rgba(255,107,53,.18);border-color:var(--pri)}}
.cb.nudge{animation:nud 1.6s ease-in-out infinite;color:var(--pri)}
/* 手机舞台：允许换行 + 自动收缩，避免窄窗口/投影时右侧手机被裁掉
   （曾出现 3 台手机总宽 1040px > 视口 900px，第 3 台整台看不见） */
.stage{display:flex;gap:clamp(14px,2.4vw,40px);justify-content:center;align-items:flex-start;flex-wrap:wrap;padding:16px 0 40px;min-height:calc(100vh - 200px)}
.pu{display:flex;flex-direction:column;align-items:center;gap:14px;transition:transform .4s cubic-bezier(.4,0,.2,1);max-width:100%}
.pu:hover{transform:translateY(-6px)}
.pl{display:flex;align-items:center;gap:12px}
.pn{font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:700}
.pr2{font-size:10px;color:rgba(255,255,255,.3);background:rgba(255,255,255,.05);padding:3px 10px;border-radius:100px;margin-top:2px}
/* 演示字幕：自动演示时标出"这一步在演示哪个功能"，让观众看得懂。
   保持紧凑（不挤占舞台垂直空间，也不把工具栏顶到换行）。 */
.cap{max-width:298px;margin:6px 0 0;padding:5px 11px;border-radius:100px;background:var(--pri);color:#fff;
  font-family:'Space Grotesk',sans-serif;font-size:10px;font-weight:600;line-height:1.35;text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  box-shadow:0 3px 12px rgba(255,107,53,.28);animation:capin .3s cubic-bezier(.4,0,.2,1)}
@keyframes capin{from{opacity:0;transform:translateY(-5px) scale(.95)}to{opacity:1;transform:none}}
.pf{width:320px;max-width:100%;height:660px;background:#0c0c0c;border-radius:50px;padding:10px;position:relative;box-shadow:0 0 0 1.5px rgba(255,255,255,.1),0 30px 80px rgba(0,0,0,.6),0 10px 30px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.06)}
.pn2{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:110px;height:26px;background:#0c0c0c;border-radius:0 0 16px 16px;z-index:20}
.pn2::after{content:'';position:absolute;top:8px;right:20px;width:8px;height:8px;background:#1a1a2e;border-radius:50%}
.pbt{position:absolute;width:2.5px;background:#222;border-radius:2px}
.pbt.pw{right:-2.5px;top:170px;height:50px}.pbt.vu{left:-2.5px;top:140px;height:28px}.pbt.vd{left:-2.5px;top:178px;height:28px}
.ps{width:100%;height:100%;background:#fff;border-radius:42px;overflow:hidden;position:relative}
.hi{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:100px;height:4px;background:#1a1a1a;border-radius:2px;opacity:.12;z-index:25}
.app{width:100%;height:100%;display:flex;flex-direction:column;font-family:'Inter',sans-serif;color:#18181b}
.an{padding:48px 22px 14px;background:rgba(255,255,255,.92);backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid var(--g200);display:flex;align-items:center;justify-content:space-between}
.an-t{font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:700}
.an-b{font-family:'Space Grotesk',sans-serif;font-size:11px;font-weight:600;padding:7px 16px;border:1.5px solid var(--g200);border-radius:100px;cursor:pointer;color:var(--g500);transition:all .15s}
.an-b:hover{border-color:var(--g300);background:var(--g100)}
.ab{flex:1;overflow-y:auto;padding:18px 22px 24px}.ab::-webkit-scrollbar{width:0}
.hs{padding:20px 0 24px}
.hl{font-family:'Space Grotesk',sans-serif;font-size:8px;font-weight:700;letter-spacing:3.5px;color:var(--g400);margin-bottom:10px}
.ht{font-family:'Space Grotesk',sans-serif;font-size:34px;font-weight:700;letter-spacing:-1.8px;line-height:1.08}
.ht span{color:var(--g300)}
.ag{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:28px}
.btn{display:flex;align-items:center;justify-content:center;gap:7px;padding:15px 18px;border:none;border-radius:100px;font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s cubic-bezier(.4,0,.2,1);user-select:none}
.btn:active{transform:scale(.96)}
.btn.dk{background:#18181b;color:#fff;box-shadow:0 2px 12px rgba(0,0,0,.12)}
.btn.lt{background:#fff;color:#18181b;border:1.5px solid var(--g200);box-shadow:0 1px 2px rgba(0,0,0,.04)}
.btn.or{background:var(--pri);color:#fff;box-shadow:0 2px 12px rgba(255,107,53,.2)}
.btn.dg{background:var(--red);color:#fff;box-shadow:0 2px 12px rgba(250,81,81,.2)}
.sh{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px;padding-bottom:10px;border-bottom:1.5px solid #18181b}
.st{font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:700}
.sc{font-family:'Space Grotesk',sans-serif;font-size:10px;color:var(--g400);letter-spacing:1px}
.rc{background:#fff;border:1.5px solid var(--g200);border-radius:18px;padding:18px;margin-bottom:12px;cursor:pointer;transition:all .25s cubic-bezier(.4,0,.2,1);box-shadow:0 1px 2px rgba(0,0,0,.04)}
.rc:hover{border-color:var(--g300);box-shadow:0 2px 8px rgba(0,0,0,.06),0 0 1px rgba(0,0,0,.08);transform:translateY(-2px)}
.rt{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.rn{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700}
.rco{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:700;letter-spacing:2.5px;color:var(--pri)}
.rco small{display:block;font-size:7px;letter-spacing:1.5px;color:var(--g400);text-transform:uppercase}
.rs{display:flex;gap:24px}
.rsv{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700}
.rsl{font-size:8px;color:var(--g400);text-transform:uppercase;letter-spacing:1.2px;margin-top:1px}
.em{text-align:center;padding:48px 20px;color:var(--g300);animation:fi .4s ease-out}
.ei{font-size:48px;margin-bottom:10px;opacity:.6}.et{font-family:'Space Grotesk',sans-serif;font-size:13px;color:var(--g400)}.es{font-size:10px;color:var(--g300);margin-top:8px}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.og{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--g200);border:1px solid var(--g200);border-radius:16px;overflow:hidden;margin-bottom:22px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.oi{background:#fff;padding:16px 18px}
.ol{font-family:'Space Grotesk',sans-serif;font-size:8px;font-weight:700;letter-spacing:2px;color:var(--g400);margin-bottom:5px}
.ov{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:-0.8px}.ov.sm{font-size:17px}
.mm{display:flex;gap:16px;overflow-x:auto;padding:6px 0 12px}.mm::-webkit-scrollbar{height:0}
/* 成员展示：无头像，姓名胶囊（选中态为黑底） */
.mnames{display:flex;flex-wrap:wrap;gap:6px}
.mname{padding:6px 13px;border:1.5px solid var(--g200);border-radius:100px;font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:600;color:var(--g500);white-space:nowrap;transition:all .2s}
.mname.ac{background:#18181b;color:#fff;border-color:#18181b}
.br{display:flex;align-items:center;padding:12px 0;border-bottom:1px solid var(--g100)}.br:last-child{border-bottom:none}
.bi{width:40px;height:40px;border-radius:12px;background:var(--g100);display:flex;align-items:center;justify-content:center;font-size:18px;margin-right:12px}
.bin{flex:1}.bn{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600}.bm{font-family:'Space Grotesk',sans-serif;font-size:10px;color:var(--g400);margin-top:1px}
.ba{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:700}
.bd{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--g200);background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-left:10px;font-size:12px;color:var(--g400);transition:all .15s}
.bd:hover{border-color:var(--red);color:var(--red);background:var(--red-bg)}
.bbw{margin-bottom:18px}
.bh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.bl{font-family:'Space Grotesk',sans-serif;font-size:9px;font-weight:700;letter-spacing:2px;color:var(--g400)}
.bnum{font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:600;color:var(--g500)}.bnum strong{font-size:18px;color:#18181b}
.bbg{width:100%;height:8px;background:var(--g100);border-radius:4px;overflow:hidden}
.bf{height:100%;border-radius:4px;transition:width .8s cubic-bezier(.4,0,.2,1)}
.bf.safe{background:linear-gradient(90deg,#07C160,#34D399)}.bf.warn{background:linear-gradient(90deg,#FF9500,#FFBB4D)}.bf.over{background:linear-gradient(90deg,#FA5151,#FF7A7A)}
.bal{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:12px;font-size:11px;font-weight:600;margin-bottom:14px;font-family:'Space Grotesk',sans-serif}
.bal.safe{background:var(--grn-bg);color:var(--grn)}.bal.warn{background:var(--amb-bg);color:var(--amb)}.bal.over{background:var(--red-bg);color:var(--red)}
.amb{border:1.5px solid var(--g200);border-radius:18px;padding:22px;margin-bottom:18px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.aml{font-family:'Space Grotesk',sans-serif;font-size:9px;font-weight:700;letter-spacing:2px;color:var(--g400);margin-bottom:10px}
.air{display:flex;align-items:baseline;gap:4px}
.acu{font-family:'Space Grotesk',sans-serif;font-size:20px;color:var(--g300)}
.ain{font-family:'Space Grotesk',sans-serif;font-size:40px;font-weight:700;letter-spacing:-1.5px;border:none;outline:none;background:transparent;width:100%;color:#18181b}
.ain::placeholder{color:var(--g200)}
.fg{margin-bottom:16px}
.fl{font-family:'Space Grotesk',sans-serif;font-size:9px;font-weight:700;letter-spacing:2px;color:var(--g400);margin-bottom:8px}
.fi{width:100%;height:44px;background:var(--g100);border:1.5px solid transparent;border-radius:12px;padding:0 16px;font-family:'Space Grotesk',sans-serif;font-size:14px;color:#18181b;outline:none;transition:all .2s}
.fi:focus{background:#fff;border-color:var(--pri);box-shadow:0 0 0 3px rgba(255,107,53,.1)}
.pm{display:flex;gap:8px;overflow-x:auto;padding:4px 0}.pm::-webkit-scrollbar{height:0}
.pi{padding:9px 18px;border:1.5px solid var(--g200);border-radius:100px;font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:600;white-space:nowrap;cursor:pointer;transition:all .15s;user-select:none}
.pi:active,.pi.act{background:#18181b;color:#fff;border-color:#18181b}
.shm{text-align:center;padding:28px 0 24px}
.svm{font-family:'Space Grotesk',sans-serif;font-size:44px;font-weight:700;letter-spacing:-2.5px}
.brm{display:flex;align-items:center;padding:12px 0;border-bottom:1px solid var(--g100)}.brm:last-child{border-bottom:none}
.bin2{flex:1}.bnn{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600}.bnt{font-family:'Space Grotesk',sans-serif;font-size:10px;color:var(--g400)}
.bam{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700}.bam.pos{color:var(--grn)}.bam.neg{color:var(--red)}
.trm{display:flex;align-items:center;padding:10px 0;border-bottom:1px solid var(--g100)}.trm:last-child{border-bottom:none}
.tsm{width:28px;height:28px;border-radius:50%;background:#18181b;color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-size:11px;font-weight:700;margin-right:12px}
.ttm{flex:1;display:flex;align-items:center;gap:10px}
.tnm{font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600}
.tam{font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:700;color:var(--pri)}
.abb{display:flex;gap:8px;padding:14px 22px 28px;background:rgba(255,255,255,.92);backdrop-filter:blur(20px) saturate(180%);border-top:1px solid var(--g200)}
.abb .btn{flex:1;padding:13px 16px}
.mo{position:absolute;inset:0;background:rgba(0,0,0,.3);backdrop-filter:blur(4px);z-index:50;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .3s}
.mo.show{opacity:1;pointer-events:auto}
.mm2{width:100%;background:#fff;border-radius:22px 22px 0 0;max-height:85%;overflow-y:auto;transform:translateY(100%);transition:transform .4s cubic-bezier(.32,.72,0,1);box-shadow:0 -8px 40px rgba(0,0,0,.1)}
.mo.show .mm2{transform:translateY(0)}
.mh{width:36px;height:4px;background:var(--g200);border-radius:2px;margin:12px auto 0}
.mhd{display:flex;justify-content:space-between;align-items:center;padding:16px 22px 12px}
.mt{font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:700}
.mc{width:32px;height:32px;border-radius:50%;background:var(--g100);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;color:var(--g500);transition:all .15s}
.mc:hover{background:var(--g200)}
.mb{padding:0 22px 24px}
.co{position:absolute;inset:0;background:rgba(0,0,0,.25);backdrop-filter:blur(6px);z-index:60;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.co.show{opacity:1;pointer-events:auto}
.cb2{background:#fff;border-radius:20px;padding:28px 24px 20px;width:80%;max-width:260px;text-align:center;transform:scale(.9);transition:transform .3s cubic-bezier(.32,.72,0,1);box-shadow:0 16px 48px rgba(0,0,0,.12)}
.co.show .cb2{transform:scale(1)}
.ci{font-size:32px;margin-bottom:10px}
.ct{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700;margin-bottom:6px}
.cd{font-size:12px;color:var(--g500);margin-bottom:20px}
.cbs{display:flex;gap:8px}.cbs .btn{flex:1;padding:11px 16px;font-size:13px}
.toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#18181b;color:#fff;padding:11px 24px;border-radius:100px;font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:600;z-index:70;opacity:0;transition:all .3s cubic-bezier(.4,0,.2,1);pointer-events:none;box-shadow:0 8px 32px rgba(0,0,0,.15)}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.sp{position:relative;background:#18181b;border-radius:18px;padding:18px;margin-bottom:16px;overflow:hidden}
.spc{background:#fff;border-radius:12px;padding:16px;min-height:120px}
.sl{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--pri),transparent);animation:sm 1.8s ease-in-out infinite;z-index:5;box-shadow:0 0 16px rgba(255,107,53,.5)}
@keyframes sm{0%{top:8%}50%{top:88%}100%{top:8%}}
.ss{text-align:center;padding:10px;font-family:'Space Grotesk',sans-serif;font-size:11px;color:var(--pri);font-weight:600}
.cts{display:flex;gap:6px;margin-bottom:16px}
.ct2{flex:1;padding:12px 8px;border:1.5px solid var(--g200);border-radius:14px;text-align:center;cursor:pointer;transition:all .2s}
.ct2:active,.ct2.act{border-color:#18181b;background:#18181b;color:#fff}
.cti{font-size:22px;margin-bottom:4px}.ctl{font-family:'Space Grotesk',sans-serif;font-size:9px;font-weight:700}
.ca{border:2px dashed var(--g200);border-radius:18px;padding:32px 20px;text-align:center;margin-bottom:16px;cursor:pointer;transition:all .2s}
.ca:hover{border-color:var(--pri);background:var(--pri-bg)}
.cai{font-size:40px;margin-bottom:8px}.cat{font-family:'Space Grotesk',sans-serif;font-size:12px;color:var(--g400)}
/* 提示条：轻量、单行、不抢戏。多条时并成一条，避免"糊一堆灰盒子" */
.os{display:flex;align-items:center;gap:7px;padding:8px 12px;background:transparent;border-left:2px solid var(--g200);border-radius:0 8px 8px 0;margin-bottom:10px;font-family:'Space Grotesk',sans-serif;font-size:10px;color:var(--g500);line-height:1.5}
.os b{color:#18181b;font-weight:600}
.ors{margin-bottom:14px}
.orc{background:#fff;border:1.5px solid var(--g200);border-radius:16px;padding:16px;margin-bottom:10px;cursor:pointer;transition:all .2s;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.orc:hover{border-color:var(--g300);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.orc.sel{border-color:var(--pri);background:var(--pri-bg)}
.ort{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.ord{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:700}
.ora{font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:700}
.orm{font-family:'Space Grotesk',sans-serif;font-size:10px;color:var(--g400)}
.orb{display:inline-block;padding:2px 8px;border-radius:100px;font-family:'Space Grotesk',sans-serif;font-size:9px;font-weight:700}
.orb.single{background:var(--g100);color:var(--g500)}.orb.list{background:#EEF2FF;color:var(--blu)}.orb.receipt{background:var(--amb-bg);color:var(--amb)}.orb.invoice{background:var(--red-bg);color:var(--red)}
.oc{display:inline-block;margin-left:4px;font-family:'Space Grotesk',sans-serif;font-size:9px;color:var(--grn);font-weight:700}
.mbi{background:#fff;border:1px solid var(--g200);border-radius:14px;padding:16px;font-family:'Space Grotesk',sans-serif;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.mbr{display:flex;justify-content:space-between;padding:5px 0;font-size:11px;color:var(--g500)}
.mbr.tot{border-top:1px solid var(--g200);margin-top:6px;padding-top:8px;font-weight:700;font-size:14px;color:#18181b}
.mbt{text-align:center;font-weight:700;font-size:14px;margin-bottom:10px}
.mbs{text-align:center;font-size:9px;color:var(--g400);margin-bottom:10px}
.sf{animation:sp2 .8s cubic-bezier(.4,0,.2,1)}

<body>
<div class="bg"></div>
<div class="wrap">

    <div><h1>✈️ TravelAA · 多人实时联动演示</h1><p id="hdrSub">每个手机 = 一个真实用户 · 操作实时同步 · 展示多人AA完整流程</p></div>

    </div>

</div>
<div class="fh">💡 这是<b>多人 AA</b>演示：点工具栏 <b>＋</b> 加到 3~4 台手机（每台 = 一个真实用户）· 所有手机实时同步 · 或点 <b>▶ 自动演示</b> 看完整流程</div>

<!-- 共享算法内核（与小程序、服务端同一份代码，UMD 三端复用；纯本地计算，无网络依赖） -->
<script src="../apps/miniprogram/utils/ai.js"></script>
<script src="../apps/miniprogram/utils/ctrip.js"></script>
<!-- 订单截图样例（base64 内嵌，离线可用） -->
<script src="assets/vision-samples.js"></script>
<script>
var State={rooms:[],bills:[],nextRoomId:1,nextBillId:1,phoneCount:1};
var USERS=[{id:'u1',name:'小明',color:'#FF6B35',role:'发起人'},{id:'u2',name:'小红',color:'#E91E63',role:'成员'},{id:'u3',name:'小李',color:'#2196F3',role:'成员'},{id:'u4',name:'小王',color:'#4CAF50',role:'成员'}];
var ocrState={};var pendingDelete={};

/* ==================================================================
   V3 共享内核适配层
   全部为本地计算（TravelAI / TravelCTrip 为 UMD 内核，离线可用）；
   不依赖任何服务器与 API Key，AI 通道仅作可选增强（见 probeEngine）。
   ================================================================== */
var AI = window.TravelAI || null;
var CTRIP = window.TravelCTrip || null;

var CURRENCIES = [
  { code: 'CNY', label: '¥ 人民币' },
  { code: 'JPY', label: '¥ 日元' },
  { code: 'USD', label: '$ 美元' },
  { code: 'KRW', label: '₩ 韩元' },
  { code: 'THB', label: '฿ 泰铢' },
  { code: 'EUR', label: '€ 欧元' },
  { code: 'HKD', label: 'HK$ 港币' }
];

var AI_SAMPLES = [
  '打车去机场86块，我垫的，和小红小李平分',
  '昨天晚上吃火锅三百二十八，四人AA',
  '酒店4晚3200，我付的，大家平摊',
  '迪士尼门票380，请客，不用还了'
];

/* 金额格式化：与页面既有风格一致 */
function money(n, dec) {
  return (Number(n) || 0).toFixed(dec === undefined ? 2 : dec);
}

/* 当前币种 → 人民币汇率（由内核提供，记账时快照）
   必须用 AI.getRate()（不取整），不能用 AI.toCNY(1,code)：
   toCNY 会 round2 到两位小数，日元 0.048 会变成 0.05，
   导致账单汇率快照与结算口径不一致、账不平。 */
function rateOf(code) {
  if (!code || code === 'CNY' || !AI) return 1;
  return AI.getRate ? AI.getRate(code) : (AI.toCNY(1, code));
}

/* 账单人民币金额（快照优先） */
function billCNY(b) {
  if (!b) return 0;
  if (AI) return AI.billCNY(b);
  return b.cnyAmount != null ? b.cnyAmount : (Number(b.amount) || 0);
}

function membersOf(room) {
  return (room && room.members ? room.members : []).map(function (m) { return { id: m.id, name: m.name }; });
}

function roomBills(roomId) {
  return State.bills.filter(function (b) { return b.roomId === roomId; });
}

/* 房间「集体消费」：只统计 AA 部分 —— 私账（人情账）不计入，
   否则"这次旅行花了多少"会被个人消费撑虚。 */
function roomTotalCNY(roomId) {
  var bills = roomBills(roomId);
  if (AI && AI.groupSpend) return AI.groupSpend(bills).total;
  return bills.reduce(function (s, b) { return s + billCNY(b); }, 0);
}

/* 某人在本房间的「我的私账」合计（人民币）—— 他想知道"这些零碎我到底花了多少" */
function myPersonalCNY(userId, roomId) {
  if (!AI || !AI.personalSpend) return 0;
  return AI.personalSpend(roomBills(roomId), userId).total;
}

/* 统一构造账单：补全多币种快照、来源、时间（统计页按天聚合依赖 createdAt）
   splitType 支持三种：
     equal  均分（默认，走 allocateEvenly 消除尾差）
     treat  请客（付款人全额承担）
     sole   不参与 AA（代购/私人消费，付款人自己承担；语义同 treat 但不计入他人均摊）
   另有 opts.roundedLoss：把金额抹零后的差额并成一笔「抹零损耗」，
   保证 splits 合计恒等于账单金额（账恒平）。 */
function makeBill(room, opts) {
  var amount = Number(opts.amount) || 0;
  var currency = opts.currency || 'CNY';
  var rate = currency === 'CNY' ? 1 : rateOf(currency);
  var members = room.members;
  var splits;
  if (opts.splits) {
    splits = opts.splits;
  } else if (opts.splitType === 'treat' || opts.splitType === 'sole') {
    splits = members.map(function (m) {
      return { memberId: m.id, memberName: m.name, amount: m.id === opts.payer ? amount : 0 };
    });
  } else {
    var parts = AI ? AI.allocateEvenly(amount, members.length)
                   : members.map(function () { return amount / members.length; });
    splits = members.map(function (m, i) {
      return { memberId: m.id, memberName: m.name, amount: parts[i] };
    });
  }
  // 抹零：把差额并入分摊（作为独立的「抹零损耗」行），合计仍等于账单金额
  if (opts.roundedLoss && AI && Math.abs(opts.roundedLoss) > 0.004) {
    splits = AI.applyRoundingLoss(splits, amount);
  }
  return {
    id: 'bill_' + State.nextBillId++,
    roomId: room.id,
    payer: opts.payer,
    payerName: opts.payerName || '',
    amount: amount,
    currency: currency,
    rate: rate,
    cnyAmount: Math.round(amount * rate * 100) / 100,
    description: opts.description || '消费',
    category: opts.category || 'food',
    splitType: opts.splitType || 'equal',
    // scope 区分「集体账」与「个人私账（人情账）」：
    // 两者都由付款人全额承担，但私账不计入房间总消费，只累计到本人的"我花了多少"。
    // 请客 = group（仍是集体消费，只是某人买单）；私账 = personal。
    scope: opts.scope || (opts.splitType === 'sole' ? 'personal' : 'group'),
    splits: splits,
    source: opts.source || 'manual',
    roundedLoss: opts.roundedLoss || 0,
    timeStr: opts.timeStr || '刚刚',
    createdAt: opts.createdAt || new Date().toISOString()
  };
}

/* AI 通道探测（可选增强）：仅探测本机服务，未连接时页面完整可用 */
var engineInfo = { online: false, model: '', checked: false };
function probeEngine() {
  var done = function () { engineInfo.checked = true; renderEngineBadge(); };
  if (typeof fetch !== 'function') { done(); return; }
  var ctl = typeof AbortController === 'function' ? new AbortController() : null;
  var timer = setTimeout(function () { if (ctl) ctl.abort(); }, 1500);
  fetch('http://localhost:3000/api/ai/engine', ctl ? { signal: ctl.signal } : {})
    .then(function (r) { return r.json(); })
    .then(function (d) {
      clearTimeout(timer);
      if (d && d.engine && d.engine.cloudLLM) {
        engineInfo.online = true;
        engineInfo.model = d.engine.cloudModel || 'LLM';
      }
      done();
    })
    .catch(function () { clearTimeout(timer); done(); });
}
function renderEngineBadge() {
  var el = document.getElementById('engineBadge');
  if (!el) return;
  if (engineInfo.online) {
    el.className = 'cb act';
    el.textContent = '☁️ AI 已连接 · ' + engineInfo.model;
  } else {
    el.className = 'cb';
    el.textContent = '🔌 离线模式 · 本地规则引擎';
  }
}

/* ============ 页面级小工具 ============ */
var CATS = [['food', '🍜 餐饮'], ['transport', '🚗 交通'], ['hotel', '🏨 住宿'], ['ticket', '🎫 门票'], ['shopping', '🛍️ 购物'], ['other', '📦 其他']];

function catLabel(cat) {
  for (var i = 0; i < CATS.length; i++) { if (CATS[i][0] === cat) return CATS[i][1]; }
  return '📦 其他';
}
function curSym(code) {
  return { CNY: '¥', JPY: '¥', USD: '$', KRW: '₩', THB: '฿', EUR: '€', HKD: 'HK$' }[code] || '¥';
}
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/"/g, '&quot;')
    .replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function getCatIcon2(cat) {
  for (var i = 0; i < CATS.length; i++) { if (CATS[i][0] === cat) return CATS[i][1].split(' ')[0]; }
  return '📦';
}

function renderPhones(){
  var stage=document.getElementById('phonesStage');stage.innerHTML='';
  for(var i=0;i<State.phoneCount;i++){
    var user=USERS[i];var phone=document.createElement('div');
    phone.className='pu';phone.id='phone-'+user.id;
    phone.innerHTML='<div class="pl"><div><div class="pn" style="color:'+user.color+'">'+user.name+'</div><div class="pr2">'+user.role+'</div></div></div><div class="cap" id="cap-'+user.id+'" style="display:none;"></div><div class="pf"><div class="pn2"></div><div class="pbt pw"></div><div class="pbt vu"></div><div class="pbt vd"></div><div class="ps"><div class="app" id="app-'+user.id+'"></div><div class="toast" id="toast-'+user.id+'"></div><div class="co" id="confirm-'+user.id+'"><div class="cb2"><div class="ci">🗑️</div><div class="ct" id="confirmTitle-'+user.id+'">删除账单？</div><div class="cd" id="confirmDesc-'+user.id+'">此操作不可撤销</div><div class="cbs"><button class="btn lt" onclick="cancelConfirm(\''+user.id+'\')">取消</button><button class="btn dg" onclick="doConfirm(\''+user.id+'\')">删除</button></div></div></div><div class="hi"></div></div></div>';
    stage.appendChild(phone);renderApp(user);
    if (CAPTION[user.id]) setCaption(user.id, CAPTION[user.id]);
  }
}

/* 演示字幕条：自动演示时在手机上方打出"这一步在演示什么功能"
   —— 观众看得到功能名，而不是只看到数据在变。 */
var CAPTION = {};
function setCaption(uid, text) {
  CAPTION[uid] = text || '';
  var el = document.getElementById('cap-' + uid);
  if (el) {
    el.textContent = CAPTION[uid];
    el.style.display = CAPTION[uid] ? 'block' : 'none';
  }
}
function clearCaptions() {
  USERS.forEach(function (u) { setCaption(u.id, ''); });
}

function renderApp(user){
  var app=document.getElementById('app-'+user.id);if(!app)return;
  var myRooms=State.rooms.filter(function(r){return r.members.some(function(m){return m.id===user.id})});
  var cp=user._page||'home';var crid=user._roomId||null;
  var titles={home:'TravelAA',room:'房间详情',add:'记一笔',capture:'记账方式',settle:'一键结算',stats:'消费统计'};
  /* 导航闭环：左侧返回（非首页时始终存在）· 中间标题（点按回首页）· 右侧 STATS（首页/房间页） */
  var backBtn=(cp==='home')?'<div style="width:44px;"></div>':'<div class="an-b" onclick="phoneGoBack(\''+user.id+'\')" title="返回上一页">←</div>';
  var rightBtn=(cp==='home'||cp==='room')
    ? '<div class="an-b" onclick="phoneGoStats(\''+user.id+'\',\''+(crid||'')+'\')">STATS</div>'
    : '<div style="width:44px;"></div>';
  var html='<div class="an">'+backBtn+'<div class="an-t" style="flex:1;text-align:center;cursor:pointer;" onclick="phoneGoHome(\''+user.id+'\')" title="回到首页">'+(titles[cp]||'TravelAA')+'</div>'+rightBtn+'</div><div class="ab">';
  if(cp==='home')html+=renderHome(user,myRooms);
  else if(cp==='room')html+=renderRoomDetail(user.id,crid);
  else if(cp==='add')html+=renderAddBill(user.id,crid);
  else if(cp==='capture')html+=renderCapture(user.id,crid);
  else if(cp==='settle')html+=renderSettle(user.id,crid);
  else if(cp==='stats')html+=renderStats(user.id,crid);
  html+='</div>';
  if(cp==='room')html+='<div class="abb"><button class="btn lt" onclick="phoneGoAdd(\''+user.id+'\',\''+crid+'\')">＋ 记一笔</button><button class="btn or" onclick="phoneGoCapture(\''+user.id+'\',\''+crid+'\')">📷 拍照</button><button class="btn dk" onclick="phoneGoSettle(\''+user.id+'\',\''+crid+'\')">结算</button></div>';
  else if(cp==='add')html+='<div class="abb"><button class="btn dk" style="flex:1;" onclick="submitBill(\''+user.id+'\',\''+crid+'\')">确认记账</button></div>';

/* ============================================================
   账单详情（手动「多退少补」入口）
   ------------------------------------------------------------
   用户需求：已入账的账要能改"谁该摊这笔"。典型场景——
     · 房租先按 3 人摊，后来发现小李没住 → 把小李移出，剩下两人重分
     · 事后想起来某人其实也住了 → 追加进分摊
   实现方式：不改原账单，而是生成一张**零和调整单**（历史留痕、账恒平）。
   ============================================================ */
function openBillDetail(userId, billId){
  var u=USERS.find(function(x){return x.id===userId});if(!u)return;
  var room=State.rooms.find(function(r){return r.id===u._roomId});if(!room)return;
  var bill=State.bills.filter(function(b){return b.id===billId})[0];if(!bill)return;
  /* 该账单当前实际参与分摊的人（叠加已有调整单） */
  var all=roomBills(room.id);
  var eff=AI&&AI.effectiveShares?AI.effectiveShares(bill,all):(bill.splits||[]);
  var parts={};eff.forEach(function(s){if(Math.abs(s.amount)>0.004)parts[s.memberId]=1;});
  u._bd={billId:billId,keep:Object.keys(parts)};
  renderApp(u);
}
function bdToggle(userId,memberId){
  var u=USERS.find(function(x){return x.id===userId});if(!u||!u._bd)return;
  var k=u._bd.keep,i=k.indexOf(memberId);
  if(i>=0){ if(k.length<=1){showToast(userId,'至少要留一个人分摊');return} k.splice(i,1); }
  else k.push(memberId);
  renderApp(u);
}
function bdApply(userId){
  var u=USERS.find(function(x){return x.id===userId});if(!u||!u._bd)return;
  var room=State.rooms.find(function(r){return r.id===u._roomId});if(!room)return;
  var bill=State.bills.filter(function(b){return b.id===u._bd.billId})[0];if(!bill)return;
  var adj=AI&&AI.buildAdjustmentForReshare?AI.buildAdjustmentForReshare(bill,u._bd.keep,{}):null;
  if(!adj){showToast(userId,'分摊没有变化，无需调整');u._bd=null;renderApp(u);return}
  State.bills.push(Object.assign(adj,{
    id:'bill_'+State.nextBillId++, roomId:room.id,
    payer:bill.payer, payerName:bill.payerName,
    timeStr:'刚刚', createdAt:new Date().toISOString()
  }));
  var bills=roomBills(room.id);
  var nb=AI.netBalances(bills,room.members);
  u._bd=null;
  syncAll();
  showToast(userId,'🧾 已重新分摊 · 账'+(nb.balanced?'恒平 ✅':'不平 ⚠️'));
}
function bdClose(userId){
  var u=USERS.find(function(x){return x.id===userId});if(!u)return;
  u._bd=null;renderApp(u);
}

/* ============================================================
   消费统计（会复盘）：分类占比 + 每日消费 + AI 洞察 + 入账方式

function renderStats(userId,roomId){
  var room=State.rooms.find(function(r){return r.id===roomId});
  var allBills=room?State.bills.filter(function(b){return b.roomId===roomId}):State.bills;
  var scopeName=room?room.name:'全部旅行';
  if(!allBills.length)return '<div class="em"><div class="ei">📊</div><div class="et">还没有数据</div><div class="es">先记几笔账再来看统计</div></div>';
  /* 统计口径：默认只看「集体账」；私账（人情账）单独一块，不混进总消费 */
  var bills=allBills.filter(function(b){return !AI||!AI.isSoleBill||!AI.isSoleBill(b)});
  var total=bills.reduce(function(s,b){return s+billCNY(b)},0);
  var me=USERS.filter(function(x){return x.id===userId})[0];
  var myP=AI&&AI.personalSpend?AI.personalSpend(allBills,userId):{total:0,count:0,list:[]};
  var html='<div class="hs" style="padding:8px 0 14px;"><div class="hl">SPENDING REPORT</div><div class="ht">消费统计</div><div style="font-size:10.5px;color:var(--g400);margin-top:4px;">'+esc(scopeName)+'</div></div>';
  html+='<div class="og"><div class="oi"><div class="ol">TOTAL / 集体账</div><div class="ov">¥'+money(total,0)+'</div></div><div class="oi"><div class="ol">BILLS / 笔数</div><div class="ov sm">'+bills.length+'</div></div></div>';

  /* ---- 我的私账（人情账）：不进 AA 的零碎钱，只有本人可见 ---- */
  if(myP.count>0){
    var allIn=total+myP.total;
    html+='<div class="sh" style="margin-top:16px;"><div class="st">我的私账</div><div class="sc">PERSONAL · 仅你可见</div></div>';
    html+='<div class="mbi" style="background:#18181b;color:#fff;border:none;">';
    html+='<div style="font-size:10px;letter-spacing:1.6px;color:rgba(255,255,255,.45);">'+(me?esc(me.name):'我')+' 自己花的</div>';
    html+='<div style="font-family:Space Grotesk,sans-serif;font-size:26px;font-weight:700;letter-spacing:-1px;margin-top:4px;">¥'+money(myP.total)+'</div>';
    html+='<div style="font-size:11px;color:rgba(255,255,255,.6);margin-top:6px;">'+myP.count+' 笔零碎 · 不进 AA、不影响别人</div>';
    html+='<div style="margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.12);font-size:11px;color:rgba(255,255,255,.8);">这次旅行我总共花了　<b style="font-size:15px;">¥'+money(allIn)+'</b><br><span style="color:rgba(255,255,255,.5);font-size:10px;">= 集体账分摊后的个人部分 + 私账</span></div>';
    html+='</div>';
    html+='<div style="margin-top:10px;font-size:10px;color:var(--g400);line-height:1.6;">明细：';
    myP.list.slice(-6).forEach(function(b){html+='「'+esc(b.description)+'」'+curSym(b.currency)+money(b.amount,0)+'　';});
    if(myP.count>6)html+='… 等 '+myP.count+' 笔';
    html+='</div>';
  }

  /* 分类占比 */
  var byCat={};bills.forEach(function(b){var c=b.category||'other';byCat[c]=(byCat[c]||0)+billCNY(b);});
  var catList=Object.keys(byCat).map(function(k){return{cat:k,amount:byCat[k]};}).sort(function(a,b){return b.amount-a.amount;});
  html+='<div class="sh"><div class="st">分类占比</div><div class="sc">BY CATEGORY</div></div>';

  });

  if(AI){
    /* 每日消费（内核 dailyStats） */
    var d=AI.dailyStats(bills);

      html+='<div class="sh" style="margin-top:18px;"><div class="st">AI 消费洞察</div><div class="sc">INSIGHT</div></div>';
      html+='<div class="mbi" style="margin-bottom:10px;"><div style="font-size:12px;line-height:1.7;">'+esc(insight.summary)+'</div></div>';
      (insight.tips||[]).slice(0,3).forEach(function(t){
        html+='<div style="font-size:11px;color:var(--g500);padding:7px 0;border-bottom:1px solid var(--g100);">💡 '+esc(t)+'</div>';
      });
    }
  }

  /* 入账方式统计 */
  var bySrc={};bills.forEach(function(b){var s=b.source||'manual';bySrc[s]=(bySrc[s]||0)+1;});
  html+='<div class="sh" style="margin-top:18px;"><div class="st">入账方式</div><div class="sc">'+bills.length+' ITEMS</div></div>';
  Object.keys(bySrc).forEach(function(s){
    html+='<div class="mbr"><span>'+sourceLabel(s)+'</span><span>'+bySrc[s]+' 笔</span></div>';
  });
  return html;
}

  var html='';

  /* ============================================================
     记账页设计原则（重要，别改回"表单堆料"）：
       一句话是**主入口**；金额/说明/分类/付款人/分摊 全部有合理默认值，
       用户不需要逐个确认。非常用能力（币种/分类/分摊方式/抹零）收进
       「更多选项」，默认收起 —— 一次记账要做的决定从 ~24 个降到 ~5 个。
     ============================================================ */

  /* ---- ① 一句话记账（主入口） ---- */
  html+='<div class="amb"><div class="aml">说一句就能记 / SAY IT</div>';
  html+='<input class="fi" placeholder="如：打车去机场86块，我垫的，和小红平分" value="'+esc(aiText)+'" oninput="updateAiText(\''+userId+'\',this.value)" onkeydown="aiKeydown(event,\''+userId+'\')">';
  html+='<div style="display:flex;gap:6px;margin-top:10px;">';
  html+='<button class="btn lt" style="flex:.85;font-size:11px;padding:12px 6px;white-space:nowrap;" onclick="startVoiceInput(\''+userId+'\')">'+(u._listening?'🎙️ 聆听中':'🎙️ 语音')+'</button>';
  html+='<button class="btn dk" data-act="ai-parse" style="flex:1.5;font-size:11.5px;padding:12px 6px;white-space:nowrap;" onclick="aiParseBill(\''+userId+'\')">🤖 智能填表</button>';
  html+='<button class="btn lt" style="flex:.85;font-size:11px;padding:12px 6px;white-space:nowrap;" onclick="aiUseSample(\''+userId+'\')">💡 例子</button>';
  html+='</div>';
  if(ai&&ai.parsed){
    var p=ai.parsed;
    html+='<div class="mbi" style="margin-top:12px;">';
    html+='<div class="mbt">'+(p.success?'✅ 已填好，确认即可':'⚠️ 只认出部分，请补一下')+'</div>';
    html+='<div class="mbs">可信度 '+p.confidence+'%'+(p.currency&&p.currency!=='CNY'?' · '+p.currency:'')+' · 下面可改</div>';
    html+='</div>';
  }
  html+='</div>';

  /* ---- ② 金额（唯一的必填项） ---- */
  html+='<div class="amb"><div class="aml">多少钱 / AMOUNT</div><div class="air"><span class="acu">'+curSym(form.currency)+'</span><input class="ain" type="text" placeholder="0.00" value="'+esc(form.amount)+'" oninput="updateForm(\''+userId+'\',\'amount\',this.value)"></div>';
  if(form.currency!=='CNY'){
    html+='<div style="margin-top:8px;font-size:10.5px;color:var(--g400);">≈ ¥'+money((Number(form.amount)||0)*rateOf(form.currency))+'（按记账时汇率 '+rateOf(form.currency)+' 快照）</div>';
  }
  html+='</div>';

  /* ---- ③ 说明（选填，留空就用分类名） ---- */
  html+='<div class="fg"><div class="fl">买了什么 <span style="color:var(--g300);font-weight:400;">选填</span></div><input class="fi" placeholder="如：晚餐、打车、门票" value="'+esc(form.desc)+'" oninput="updateForm(\''+userId+'\',\'desc\',this.value)"></div>';

  /* ---- ④ 归属：AA 还是我的私账（一句话说清，不给术语） ---- */
  var isPersonal=form.splitType==='sole';
  html+='<div class="fg"><div class="fl">算谁的</div><div class="pm">';
  html+='<div class="pi '+(!isPersonal?'act':'')+'" onclick="setOwnership(\''+userId+'\',\'aa\')">👥 大家 AA</div>';
  html+='<div class="pi '+(isPersonal?'act':'')+'" onclick="setOwnership(\''+userId+'\',\'personal\')">🙋 我的私账</div>';
  html+='</div>';
  html+='<div style="margin-top:8px;font-size:10.5px;color:var(--g400);line-height:1.6;">'+
    (isPersonal
      ? '🙋 <b style="color:var(--g500);">私账</b>：只有你花钱、只有你看得到小计，<b style="color:var(--g500);">不进 AA、不影响别人</b>，但会累计到你的「我花了多少」。'
      : '👥 <b style="color:var(--g500);">AA</b>：按下面的分摊方式计入集体账，结算时互相找补。')+
    '</div></div>';

  /* ---- ⑤ 付款人（默认我，才需要时改） ---- */
  html+='<div class="fg"><div class="fl">谁付的 <span style="color:var(--g300);font-weight:400;">默认我</span></div><div class="pm">';
  room.members.forEach(function(m){
    html+='<div class="pi '+(form.payer===m.id?'act':'')+'" onclick="updateForm(\''+userId+'\',\'payer\',\''+m.id+'\');renderApp(USERS.find(function(u){return u.id==\''+userId+'\'}))">'+esc(m.name)+(m.id===userId?' · 我':'')+'</div>';
  });
  html+='</div></div>';

  /* ---- ⑥ 更多选项（默认收起：分类 / 分摊方式 / 币种 / 抹零） ---- */
  var adv=!!u._adv;
  html+='<button class="btn lt" style="width:100%;margin-top:16px;font-size:12px;" onclick="toggleAdv(\''+userId+'\')">'+
    (adv?'▲ 收起更多选项':'▼ 更多选项（分类 · 分摊方式 · 币种 · 抹零）')+'</button>';

  if(adv){
    html+='<div class="fg" style="margin-top:14px;"><div class="fl">消费分类</div><div class="pm">';
    CATS.forEach(function(c){
      html+='<div class="pi '+(form.category===c[0]?'act':'')+'" onclick="updateForm(\''+userId+'\',\'category\',\''+c[0]+'\');renderApp(USERS.find(function(u){return u.id==\''+userId+'\'}))">'+c[1]+'</div>';
    });
    html+='</div></div>';

    /* 分摊方式：AA 归属下才有意义 */
    if(!isPersonal){
      html+='<div class="fg"><div class="fl">怎么分</div><div class="pm">';
      [['equal','⚖️ 均分'],['treat','🎁 我请客']].forEach(function(c){
        html+='<div class="pi '+(form.splitType===c[0]?'act':'')+'" onclick="updateForm(\''+userId+'\',\'splitType\',\''+c[0]+'\');renderApp(USERS.find(function(u){return u.id==\''+userId+'\'}))">'+c[1]+'</div>';
      });
      html+='</div></div>';
    }

    /* 币种：只在实际用到时才需要 */
    html+='<div class="fg"><div class="fl">币种</div><div class="pm">';
    CURRENCIES.forEach(function(c){
      html+='<div class="pi '+(form.currency===c.code?'act':'')+'" onclick="selectCurrency(\''+userId+'\',\''+c.code+'\')">'+c.label+'</div>';
    });
    html+='</div></div>';

    /* 抹零：出境游凑整用，按当前金额给建议 */
    var rnd=AI?AI.smartRound(Number(form.amount)||0,form.currency):null;
    html+='<div class="fg"><div class="fl">抹零凑整 <span style="color:var(--g300);font-weight:400;">选填</span></div>';
    if(rnd&&rnd.changed){
      html+='<button class="btn lt" style="width:100%;font-size:12px;padding:12px;" onclick="roundAmount(\''+userId+'\')">✨ 凑成 '+curSym(form.currency)+rnd.rounded+'（差额 '+(rnd.loss>0?'+':'')+money(rnd.loss)+' 记进损耗）</button>';
    }else if(Number(form.amount)>0){
      html+='<div style="font-size:10.5px;color:var(--grn);">✅ '+curSym(form.currency)+form.amount+' 已经是顺手整数，不用凑</div>';
    }else{
      html+='<div style="font-size:10.5px;color:var(--g400);">填了金额后，可一键凑成 '+AI.roundStepOf(form.currency)+' 的整数倍</div>';
    }
    html+='</div>';
  }

  return html;
}

/* 归属切换：AA ↔ 我的私账（私账用 splitType='sole' 表达，后端/内核无需新字段） */
function setOwnership(userId, kind){
  var u=USERS.find(function(x){return x.id===userId});if(!u||!u._form)return;
  u._form.splitType = (kind==='personal') ? 'sole' : 'equal';
  renderApp(u);
}
/* 更多选项开合 */
function toggleAdv(userId){
  var u=USERS.find(function(x){return x.id===userId});if(!u)return;
  u._adv=!u._adv;renderApp(u);
}

/* 智能抹零：把金额凑到该币种的顺手整数，差额交给「抹零损耗」 */
function roundAmount(userId){
  var u=USERS.find(function(x){return x.id===userId});if(!u||!u._form||!AI)return;
  var form=u._form;
  var r=AI.smartRound(Number(form.amount)||0,form.currency||'CNY');
  if(!r.changed){showToast(userId,'已经是顺手整数了');return}
  form.amount=String(r.rounded);
  form.rounded=true;                       // 提交时据此把差额并入分摊
  form.lossAmount=r.loss;
  renderApp(u);
  showToast(userId,'✨ 已抹零到 '+curSym(form.currency)+r.rounded+'，差额 '+money(r.loss)+' 计入损耗');
}

function updateAiText(userId,val){
  var u=USERS.find(function(x){return x.id===userId});if(!u)return;
  u._aiText=val;if(u._ai&&u._ai.text!==val)u._ai=null;
}
function aiKeydown(e,userId){
  if(e&&e.key==='Enter'){if(e.preventDefault)e.preventDefault();aiParseBill(userId);}
}
function aiUseSample(userId){
  var u=USERS.find(function(x){return x.id===userId});if(!u)return;
  var idx=Math.floor(Math.random()*AI_SAMPLES.length);
  if(u._sampleIdx!=null&&AI_SAMPLES.length>1){idx=(u._sampleIdx+1)%AI_SAMPLES.length}
  u._sampleIdx=idx;u._aiText=AI_SAMPLES[idx];u._ai=null;
  renderApp(u);showToast(userId,'💡 已填入示例，点「AI 识别」试试');
}
function aiParseBill(userId){
  var u=USERS.find(function(x){return x.id===userId});if(!u)return;
  var room=State.rooms.find(function(r){return r.id===u._roomId});if(!room)return;
  var text=(u._aiText||'').trim();
  if(!text){showToast(userId,'请先输入一句话，或点「换个例子」');return}
  var members=membersOf(room);
  var parsed, engine='本地规则引擎';
  if(AI&&AI.parseBillText){
    parsed=AI.parseBillText(text,members,{meName:u.name});
  }else{
    showToast(userId,'内核未加载，无法解析');return;
  }
  u._ai={text:text,parsed:parsed,engine:engine};
  if(parsed&&parsed.success){
    if(!u._form)u._form={amount:'',desc:'',category:'food',payer:userId,splitType:'equal',currency:'CNY'};
    u._form.amount=String(parsed.amount);
    if(parsed.description)u._form.desc=parsed.description;
    if(parsed.category)u._form.category=parsed.category;
    var payer=room.members.find(function(m){return m.name===parsed.payerName});
    if(payer)u._form.payer=payer.id;
    u._form.splitType=parsed.splitType==='treat'?'treat':'equal';
    if(parsed.currency&&parsed.currency!=='CNY')u._form.currency=parsed.currency;
    showToast(userId,'🤖 解析完成 · 可信度 '+parsed.confidence+'%');
  }else{
    showToast(userId,'没识别出金额，试试「打车去机场86块」这类说法');
  }
  renderApp(u);
}
function selectCurrency(userId,code){
  var u=USERS.find(function(x){return x.id===userId});if(!u||!u._form)return;
  u._form.currency=code;renderApp(u);
}
/* 语音输入：Web Speech API（浏览器能力，无网络与密钥依赖；不支持时给出明确提示） */
function startVoiceInput(userId){
  var u=USERS.find(function(x){return x.id===userId});if(!u)return;
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){showToast(userId,'当前浏览器不支持语音输入，请用文字输入');return}
  try{
    var rec=new SR();rec.lang='zh-CN';rec.interimResults=false;rec.maxAlternatives=1;
    u._listening=true;renderApp(u);
    rec.onresult=function(e){
      var t=e.results[0][0].transcript;
      u._listening=false;u._aiText=((u._aiText||'')+t).trim();u._ai=null;
      renderApp(u);showToast(userId,'🎙️ 听到：'+t);
    };
    rec.onerror=function(){u._listening=false;renderApp(u);showToast(userId,'语音识别失败，请重试或改用文字')};
    rec.onend=function(){if(u._listening){u._listening=false;renderApp(u)}};
    rec.start();
  }catch(e){
    u._listening=false;renderApp(u);showToast(userId,'无法启动麦克风');
  }
}

function visionRecognize(userId,roomId,which){
  var st=ocrState[userId];if(!st)return;
  var samples=window.VISION_SAMPLES||{};
  var dataUri=samples[which];
  var render=function(){renderApp(USERS.find(function(u){return u.id===userId}))};
  if(engineInfo.online&&dataUri&&typeof fetch==='function'){
    st.visionLoading=true;render();
    fetch('http://localhost:3000/api/ai/vision',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({image:dataUri})
    }).then(function(r){return r.json()}).then(function(d){
      st.visionLoading=false;
      var order=d&&(d.order||d.data||d);
      if(order&&order.amount!=null){st.visionResult={source:'ai',order:order};showToast(userId,'☁️ 识别完成');}
      else{st.visionResult={source:'ai',order:{}};showToast(userId,'未识别到有效字段');}
      render();
    }).catch(function(){
      st.visionLoading=false;showToast(userId,'AI 通道调用失败，已切换内置样例');render();
    });
    return;
  }
  st.visionResult={source:'builtin',order:{

function calcSettlement(room,bills){
  var balMap={};room.members.forEach(function(m){balMap[m.id]={id:m.id,name:m.name,amount:0}});
  var hasForeign=false;
  var totalCNY=0;
  bills.forEach(function(bill){
    var cny=billCNY(bill);var raw=Number(bill.amount)||0;var scale=raw>0?cny/raw:1;
    if(bill.currency&&bill.currency!=='CNY')hasForeign=true;
    totalCNY+=cny;
    if(balMap[bill.payer])balMap[bill.payer].amount+=cny;
    (bill.splits||[]).forEach(function(s){if(balMap[s.memberId])balMap[s.memberId].amount-=s.amount*scale});
  });
  var balances=Object.values(balMap).map(function(b){return{id:b.id,name:b.name,amount:Math.round(b.amount*100)/100}}).filter(function(b){return Math.abs(b.amount)>0.01}).sort(function(a,b){return b.amount-a.amount});
  var transfers=[];var debtors=balances.filter(function(b){return b.amount<-0.01}).map(function(b){return{id:b.id,name:b.name,amount:b.amount}});var creditors=balances.filter(function(b){return b.amount>0.01}).map(function(b){return{id:b.id,name:b.name,amount:b.amount}});
  var i=0,j=0;
  while(i<debtors.length&&j<creditors.length){var amt=Math.min(-debtors[i].amount,creditors[j].amount);if(amt>0.01)transfers.push({from:debtors[i].id,fromName:debtors[i].name,to:creditors[j].id,toName:creditors[j].name,amount:Math.round(amt*100)/100});debtors[i].amount+=amt;creditors[j].amount-=amt;if(Math.abs(debtors[i].amount)<0.01)i++;if(Math.abs(creditors[j].amount)<0.01)j++}
  return{balances:balances,transfers:transfers,totalExpense:Math.round(totalCNY*100)/100,hasForeign:hasForeign};
}

function renderTourStep() {
  var step = TOUR_STEPS[tourState.idx];
  if (!step) return tourExit();
  if (typeof step.before === 'function') { try { step.before(); } catch (e) { } }
  setTimeout(function () {
    var mask = document.getElementById('tourMask');
    var el = step.sel ? document.querySelector(step.sel) : null;
    if (!mask) return;
    if (el) {
      var r = el.getBoundingClientRect();
      mask.style.display = 'block';
      mask.style.left = Math.max(4, r.left - 8) + 'px';
      mask.style.top = Math.max(4, r.top - 8) + 'px';
      mask.style.width = Math.min(window.innerWidth - 8, r.width + 16) + 'px';
      mask.style.height = (r.height + 16) + 'px';
      if (r.top > window.innerHeight * 0.55) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
    } else {
      mask.style.display = 'none';
    }
    var lbl = document.getElementById('tourStepLabel');
    var ttl = document.getElementById('tourTitle');
    var scr = document.getElementById('tourScript');
    var dots = document.getElementById('tourDots');
    var nextBtn = document.getElementById('tourNextBtn');
    var autoBtn = document.getElementById('tourAutoBtn');
    if (lbl) lbl.textContent = 'STEP ' + (tourState.idx + 1) + ' / ' + TOUR_STEPS.length;
    if (ttl) ttl.textContent = step.title;
    if (scr) scr.textContent = step.script;
    if (dots) {
      var d = '';
      TOUR_STEPS.forEach(function (_, i) { d += '<div class="tour-dot ' + (i === tourState.idx ? 'on' : '') + '"></div>'; });
      dots.innerHTML = d;
    }
    if (nextBtn) nextBtn.textContent = (tourState.idx === TOUR_STEPS.length - 1) ? '完成 ✓' : '下一步 →';

function tourNext() {
  if (tourState.idx >= TOUR_STEPS.length - 1) { showToast('u1', '🎉 导览结束，轮到你了'); return tourExit(); }
  tourState.idx++; renderTourStep();
}
function tourPrev() {
  if (tourState.idx <= 0) return;
  tourState.idx--; renderTourStep();
}
function toggleTourAuto() {
  tourState.auto = !tourState.auto;
  if (tourState.timer) { clearInterval(tourState.timer); tourState.timer = null; }
  if (tourState.auto) {
    tourState.timer = setInterval(function () {
      if (tourState.idx >= TOUR_STEPS.length - 1) { toggleTourAuto(); return; }

}
function tourExit() {

/* 复用的自检结果面板：同时把结论写进 document.title，便于无头验收 */
function showTestPanel(title, titleKey, checks) {

  var allPass = passed === checks.length;
  var old = document.getElementById('testPanel');
  if (old&&old.parentNode) old.parentNode.removeChild(old);
  var panel = document.createElement('div');
  panel.className = 'test-panel'; panel.id = 'testPanel';
  var rows = checks.map(function (c) {

  }).join('');
  panel.innerHTML = '<div class="test-card"><div class="test-hd"><div class="test-tt">' + title + '</div><div style="font-family:Space Grotesk,sans-serif;font-size:13px;font-weight:700;color:' + (allPass ? 'var(--grn)' : 'var(--red)') + ';">' + passed + ' / ' + checks.length + '</div></div>' +
    '<div class="test-sum">' + (allPass ? '✅ 一切就绪，可以开讲' : '⚠️ 有项目未通过，请检查后再演示') + '</div>' + rows +
    '<button class="btn dk" style="width:100%;margin-top:18px;" onclick="closeSelfTest()">关闭</button></div>';
  panel.addEventListener('click', function (e) { if (e.target === panel) closeSelfTest(); });
  document.body.appendChild(panel);
  document.title = allPass ? (titleKey + ' ' + passed + '/' + checks.length + ' ALL-PASS') : (titleKey + ' ' + passed + '/' + checks.length + ' FAIL');
}

      add('★ 应用后生成调整单并保持账恒平',
        State.bills.length === beforeCnt + 1 && AI.netBalances(State.bills, v3room.members).balanced === true,
        '账单 ' + beforeCnt + ' → ' + State.bills.length + ' · 账恒平 ' +
        AI.netBalances(State.bills, v3room.members).balanced);
      add('★ 手动调整单也是零和的', !!adj && Math.abs(adj.splits.reduce(function (s, x) { return s + x.amount; }, 0)) < 0.01,
        adj ? JSON.stringify(adj.splits) : '(无)');
      add('★ 调整单全部合规', AI.validateAdjustments(State.bills).ok === true,
        JSON.stringify(AI.validateAdjustments(State.bills).bad));
    }
  } catch (e) {
    add('交互测试执行异常', false, e && e.message);
  }
  resetAll();
  showTestPanel('交互验收', 'UITEST', checks);
  })();
}

renderPhones();
probeEngine();

/* ============================================================
   V3 旅行专属记账语义 · 一键演示（#v3demo）
   把"小而美"的差异点集中到一屏：
     ① 抹零（日币 12780 → 12800，差额进「抹零损耗」）
     ② 不参与AA（代购/私人消费）
     ③ 多退少补 / 暂估改价（零和调整单，历史留痕）
     ④ 结清卡片 + 礼貌催账话术
   ============================================================ */
function startV3Demo() {
  if (!AI) { showToast('u1', '内核未加载'); return; }
  resetAll();
  State.phoneCount = Math.max(3, Math.min(USERS.length, State.phoneCount || 1));
  var lbl = document.getElementById('phoneCountLabel'); if (lbl) lbl.textContent = State.phoneCount;
  renderPhones();

  /* 建房间：**当前显示的所有手机都进房间**
     ⚠️ 这里曾经写死 USERS.slice(0, 3)，导致加到 4 台时第 4 台成为"孤儿"——
        它的 _roomId 为 null、不在成员表里，只能停在首页"还没有旅行房间"，
        看起来就是"第 4 个人没反应"。房间成员必须跟随 State.phoneCount。 */
  var room = { id: 'room_' + State.nextRoomId++, name: '北海道滑雪行', destination: '北海道',
    code: '666888', creator: 'u1', members: [], totalExpense: 0,
    budgetPerPerson: 8000, startDate: '2024-12-20', endDate: '2024-12-25' };
  State.rooms.push(room);
  var active = USERS.slice(0, State.phoneCount);
  active.forEach(function (u) { room.members.push({ id: u.id, name: u.name }); });
  active.forEach(function (u) { u._roomId = room.id; u._page = 'room'; });

  function addBill(o) { State.bills.push(makeBill(room, o)); }

  /* ① 抹零：日币 12780 → 12800 */
  var jpy = AI.smartRound(12780, 'JPY');
  addBill({ payer: 'u1', payerName: '小明', amount: jpy.rounded, currency: 'JPY',
    description: '札幌居酒屋晚餐', category: 'food', source: 'ai',
    roundedLoss: jpy.loss, createdAt: '2024-12-20T19:00:00.000Z' });

  /* ② 代购不摊：小红帮朋友带的药妆 */
  addBill({ payer: 'u2', payerName: '小红', amount: 1280, description: '帮朋友代购药妆（不参与AA）',
    category: 'shopping', splitType: 'sole', source: 'manual',
    createdAt: '2024-12-21T11:00:00.000Z' });

  /* ③ 暂估改价：酒店先记 24000，退房实际 24800
       调整单是内核产物（含 isAdjustment / zeroSum / splits / delta），
       必须**先展开调整单再补账单字段**，且不能走 makeBill()
       —— makeBill 是白名单构造，会把 isAdjustment/splits 丢掉 */
  var hotel = makeBill(room, { payer: 'u1', payerName: '小明', amount: 24000, currency: 'JPY',
    description: '滑雪度假村 4 晚（暂估）', category: 'hotel', source: 'manual',
    createdAt: '2024-12-20T15:00:00.000Z' });
  State.bills.push(hotel);
  State.bills.push(Object.assign(
    AI.buildAdjustmentForReestimate(hotel, 24800, room.members, { ts: '2024-12-25T10:00:00.000Z' }),
    { id: 'bill_' + State.nextBillId++, roomId: room.id, payer: 'u1', payerName: '小明',
      timeStr: '退房', createdAt: '2024-12-25T10:00:00.000Z' }
  ));

  /* ③' 多退少补：小李提前离队，退出缆车票分摊 */
  var lift = makeBill(room, { payer: 'u3', payerName: '小李', amount: 9600, currency: 'JPY',
    description: '缆车票 3 张', category: 'ticket', source: 'manual',
    createdAt: '2024-12-22T09:00:00.000Z' });
  State.bills.push(lift);
  State.bills.push(Object.assign(
    AI.buildAdjustmentForExclusion(lift, ['u3'], { ts: '2024-12-23T09:00:00.000Z' }),
    { id: 'bill_' + State.nextBillId++, roomId: room.id, payer: 'u3', payerName: '小李',
      timeStr: '改签', createdAt: '2024-12-23T09:00:00.000Z' }
  ));

  /* ④ 口头占位：还有一笔没记清 */
  var ph = AI.buildPlaceholder({ description: '（待补：雪场租装备谁付的忘了）' });
  State.bills.push(Object.assign(makeBill(room, { payer: 'u1', payerName: '小明', amount: 0,
    description: ph.description, category: 'other', source: 'manual' }),
    { status: 'draft', needsCompletion: true, amount: 0 }));

  var u1 = USERS[0];
  u1._page = 'add';
  u1._form = { amount: '12780', desc: '札幌居酒屋晚餐', category: 'food',
    payer: 'u1', splitType: 'equal', currency: 'JPY' };
  u1._aiText = ''; u1._ai = null; u1._narr = null;

  var sub = document.getElementById('hdrSub');
  if (sub) sub.textContent = 'V3 一键演示 · 抹零 / 代购不摊 / 多退少补 / 暂估改价 / 结清卡片 —— 点 ▶ 自动演示 或自己点手机';
  syncAll();
  showToast('u1', '✨ V3 演示已就绪：看「抹零」按钮，再切到结算页看结清卡片');
}

/* ============================================================
   演示起点：默认 1 台手机，但第一眼要能看出这是"多人"产品
   ------------------------------------------------------------
   - ?n=3 或 #n=3 可直接以 N 台手机开场（如 index.html?n=4#selftest 同时生效）
   - 首次进入时高亮 ＋ 按钮，提示"可以加人"（这是最常被忽略的一步）
   ============================================================ */
(function initPhoneCount() {
  var m = /[?&#]n=(\d+)/.exec(location.href);
  if (m) {
    var n = Math.max(1, Math.min(4, parseInt(m[1], 10) || 1));
    State.phoneCount = n;
    var lbl0 = document.getElementById('phoneCountLabel');
    if (lbl0) lbl0.textContent = n;
    renderPhones();
  }
  /* 只在"没有房间、还没有任何账单"的初始态提示，演示/自检时不打扰 */
  if (State.rooms.length === 0 && State.phoneCount < 2) {
    var btn = document.getElementById('addPhoneBtn');
    if (btn) btn.classList.add('nudge');
  }
})();

if (location.hash.indexOf('#v3demo') === 0) setTimeout(startV3Demo, 350);
/* #auto 打开即自动开演；配合 ?stage=N 可定格在第 N 步（便于讲解/截图） */
if (/[#&]auto\b/.test(location.hash) || /[?&]auto=1/.test(location.href)) setTimeout(autoDemo, 500);
if (location.hash.indexOf('#selftest') === 0) setTimeout(runSelfTest, 300);
if (location.hash.indexOf('#tourtest') === 0) setTimeout(runTourTest, 400);
if (location.hash.indexOf('#uitest') === 0) setTimeout(runUITest, 400);
</script>
